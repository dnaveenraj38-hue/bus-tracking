<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bus Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#222}
header{background:#1565c0;color:white;padding:16px;text-align:center;font-size:24px;font-weight:bold}
.container{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 4px 15px #0002}
button{width:100%;padding:15px;border:0;border-radius:10px;font-size:17px;font-weight:bold;margin-top:10px;cursor:pointer}
.primary{background:#1565c0;color:white}
.green{background:#198754;color:white}
.red{background:#dc3545;color:white}
.gray{background:#555;color:white}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}
#map{height:420px;border-radius:14px;overflow:hidden;margin-top:12px}
.status{padding:13px;border-radius:10px;background:#eee;margin-top:10px;font-weight:bold}
.hidden{display:none}
.small{font-size:13px;color:#666;line-height:1.5}
</style>
</head>

<body>
<header>🚌 BUS TRACKING</header>

<div class="container">

<section id="home" class="card">
  <h2>Select User</h2>
  <button class="primary" onclick="showDriver()">🚍 Driver / Conductor</button>
  <button class="green" onclick="showPassenger()">👤 Passenger</button>
</section>

<section id="driver" class="card hidden">
  <h2>🚍 Driver / Conductor</h2>

  <input id="busName" placeholder="Bus Name (Example: DDJB)">
  <input id="busNumber" placeholder="Bus Number (Example: 30A)">
  <input id="boardNumber" placeholder="Board Number (Example: TN99 AB1234)">

  <button class="green" onclick="startGPS()">📍 SAVE & START GPS</button>
  <button class="red" onclick="stopGPS()">⛔ STOP GPS</button>

  <div id="driverStatus" class="status">GPS NOT STARTED</div>

  <div id="driverMap"></div>

  <button class="gray" onclick="goHome()">BACK</button>
</section>

<section id="passenger" class="card hidden">
  <h2>👤 Passenger</h2>

  <input id="trackBusName" placeholder="Enter Bus Name (Example: DDJB)">

  <button class="primary" onclick="trackBus()">🔎 TRACK BUS</button>

  <div id="passengerStatus" class="status">Enter bus name and press TRACK BUS.</div>

  <div id="passengerMap"></div>

  <button class="gray" onclick="goHome()">BACK</button>
</section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase -->
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase, ref, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

/*
===========================================================
PASTE YOUR FIREBASE CONFIG HERE
Firebase Console → Project settings → Your apps → Web app
===========================================================
*/
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let watchId = null;
let driverMap = null;
let passengerMap = null;
let driverMarker = null;
let passengerMarker = null;
let trackingListener = null;

window.showDriver = function(){
  home.classList.add("hidden");
  passenger.classList.add("hidden");
  driver.classList.remove("hidden");
  setTimeout(initDriverMap,100);
};

window.showPassenger = function(){
  home.classList.add("hidden");
  driver.classList.add("hidden");
  passenger.classList.remove("hidden");
  setTimeout(initPassengerMap,100);
};

window.goHome = function(){
  stopGPS();
  if(trackingListener){
    trackingListener();
    trackingListener=null;
  }
  driver.classList.add("hidden");
  passenger.classList.add("hidden");
  home.classList.remove("hidden");
};

function initDriverMap(){
  if(driverMap) return;
  driverMap=L.map("driverMap").setView([11.0168,76.9558],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors"
  }).addTo(driverMap);
}

function initPassengerMap(){
  if(passengerMap) return;
  passengerMap=L.map("passengerMap").setView([11.0168,76.9558],13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:"© OpenStreetMap contributors"
  }).addTo(passengerMap);
}

window.startGPS = function(){
  const name=document.getElementById("busName").value.trim();
  const number=document.getElementById("busNumber").value.trim();
  const board=document.getElementById("boardNumber").value.trim();

  if(!name){
    alert("Enter Bus Name first.");
    return;
  }

  if(!navigator.geolocation){
    alert("GPS is not supported by this browser.");
    return;
  }

  if(location.protocol !== "https:" && location.hostname !== "localhost"){
    alert("GPS needs HTTPS. Open the GitHub Pages HTTPS link, not the github.com code page.");
    return;
  }

  initDriverMap();

  stopGPS();

  watchId=navigator.geolocation.watchPosition(
    async position=>{
      const lat=position.coords.latitude;
      const lng=position.coords.longitude;
      const accuracy=Math.round(position.coords.accuracy || 0);

      try{
        await set(ref(db,"buses/"+name),{
          busName:name,
          busNumber:number,
          boardNumber:board,
          latitude:lat,
          longitude:lng,
          accuracy:accuracy,
          updatedAt:Date.now(),
          online:true
        });

        driverStatus.innerHTML=
          "🟢 GPS RUNNING<br>Lat: "+lat.toFixed(6)+
          "<br>Lng: "+lng.toFixed(6)+
          "<br>Accuracy: "+accuracy+" m";

        if(driverMarker) driverMarker.setLatLng([lat,lng]);
        else{
          driverMarker=L.marker([lat,lng]).addTo(driverMap)
            .bindPopup("🚌 "+name).openPopup();
        }

        driverMap.setView([lat,lng],16);
      }catch(e){
        driverStatus.innerHTML="❌ Firebase error: "+e.message;
      }
    },
    error=>{
      let msg="GPS error.";
      if(error.code===1) msg="❌ Location permission denied. Allow Location permission.";
      if(error.code===2) msg="❌ Location unavailable.";
      if(error.code===3) msg="❌ GPS request timed out.";
      driverStatus.innerHTML=msg;
    },
    {
      enableHighAccuracy:true,
      maximumAge:5000,
      timeout:20000
    }
  );
};

window.stopGPS = function(){
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }
  const s=document.getElementById("driverStatus");
  if(s) s.innerHTML="🔴 GPS STOPPED";
};

window.trackBus = function(){
  const name=document.getElementById("trackBusName").value.trim();

  if(!name){
    alert("Enter Bus Name.");
    return;
  }

  initPassengerMap();

  if(trackingListener){
    trackingListener();
    trackingListener=null;
  }

  passengerStatus.innerHTML="🔎 Searching for bus: "+name;

  const busRef=ref(db,"buses/"+name);

  trackingListener=onValue(busRef,snapshot=>{
    if(!snapshot.exists()){
      passengerStatus.innerHTML="🔴 BUS NOT FOUND / GPS NOT STARTED";
      return;
    }

    const data=snapshot.val();

    if(data.latitude===undefined || data.longitude===undefined){
      passengerStatus.innerHTML="🟡 Bus found, waiting for GPS...";
      return;
    }

    const lat=Number(data.latitude);
    const lng=Number(data.longitude);

    passengerStatus.innerHTML=
      "🟢 BUS LIVE: "+(data.busName||name)+
      "<br>Bus No: "+(data.busNumber||"-")+
      "<br>Board No: "+(data.boardNumber||"-")+
      "<br>Accuracy: "+(data.accuracy||"-")+" m";

    if(passengerMarker) passengerMarker.setLatLng([lat,lng]);
    else{
      passengerMarker=L.marker([lat,lng]).addTo(passengerMap)
        .bindPopup("🚌 "+(data.busName||name));
    }

    passengerMap.setView([lat,lng],16);
  });
};
</script>

</body>
</html>
